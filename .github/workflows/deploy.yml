name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version tag to deploy (leave empty for latest)'
        required: false
        type: string
      terraform_action:
        description: 'Terraform action (plan or apply)'
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.terraform_action == 'apply'
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        if: github.event.inputs.terraform_action == 'apply'
        id: terraform
        working-directory: ./terraform
        run: |
          echo "alb_dns_name=$(terraform output -raw alb_dns_name)" >> $GITHUB_OUTPUT
          echo "ecr_backend_url=$(terraform output -raw ecr_backend_repository_url)" >> $GITHUB_OUTPUT
          echo "ecr_frontend_url=$(terraform output -raw ecr_frontend_repository_url)" >> $GITHUB_OUTPUT
          echo "ecs_cluster=$(terraform output -raw ecs_cluster_name)" >> $GITHUB_OUTPUT
          echo "ecs_service=$(terraform output -raw ecs_service_name)" >> $GITHUB_OUTPUT

      - name: Login to Amazon ECR
        if: github.event.inputs.terraform_action == 'apply'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Docker Image
        if: github.event.inputs.terraform_action == 'apply'
        working-directory: ./backend
        run: |
          docker build -t ${{ steps.terraform.outputs.ecr_backend_url }}:latest .
          docker push ${{ steps.terraform.outputs.ecr_backend_url }}:latest
          
          # Also tag with commit SHA for rollback capability
          docker tag ${{ steps.terraform.outputs.ecr_backend_url }}:latest \
            ${{ steps.terraform.outputs.ecr_backend_url }}:${{ github.sha }}
          docker push ${{ steps.terraform.outputs.ecr_backend_url }}:${{ github.sha }}

      - name: Build and Push Frontend Docker Image
        if: github.event.inputs.terraform_action == 'apply'
        working-directory: ./frontend
        run: |
          # Set API URL for build
          export VITE_API_URL=http://${{ steps.terraform.outputs.alb_dns_name }}
          
          docker build -t ${{ steps.terraform.outputs.ecr_frontend_url }}:latest .
          docker push ${{ steps.terraform.outputs.ecr_frontend_url }}:latest
          
          # Also tag with commit SHA for rollback capability
          docker tag ${{ steps.terraform.outputs.ecr_frontend_url }}:latest \
            ${{ steps.terraform.outputs.ecr_frontend_url }}:${{ github.sha }}
          docker push ${{ steps.terraform.outputs.ecr_frontend_url }}:${{ github.sha }}

      - name: Update ECS Service
        if: github.event.inputs.terraform_action == 'apply'
        run: |
          aws ecs update-service \
            --cluster ${{ steps.terraform.outputs.ecs_cluster }} \
            --service ${{ steps.terraform.outputs.ecs_service }} \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}

      - name: Wait for ECS Service Stability
        if: github.event.inputs.terraform_action == 'apply'
        run: |
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ steps.terraform.outputs.ecs_cluster }} \
            --services ${{ steps.terraform.outputs.ecs_service }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Run Smoke Tests
        if: github.event.inputs.terraform_action == 'apply'
        run: |
          echo "Running smoke tests..."
          sleep 30
          
          # Test backend health endpoint
          curl -f http://${{ steps.terraform.outputs.alb_dns_name }}/health || exit 1
          
          # Test frontend
          curl -f http://${{ steps.terraform.outputs.alb_dns_name }}/ || exit 1
          
          echo "Smoke tests passed!"

      - name: Deployment Summary
        if: github.event.inputs.terraform_action == 'apply'
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Application URL:** http://${{ steps.terraform.outputs.alb_dns_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Image:** ${{ steps.terraform.outputs.ecr_backend_url }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend Image:** ${{ steps.terraform.outputs.ecr_frontend_url }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "**ECS Cluster:** ${{ steps.terraform.outputs.ecs_cluster }}" >> $GITHUB_STEP_SUMMARY
          echo "**ECS Service:** ${{ steps.terraform.outputs.ecs_service }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify Deployment Success
        if: success() && github.event.inputs.terraform_action == 'apply'
        run: |
          echo "✅ Deployment to ${{ github.event.inputs.environment }} successful!"
          echo "Application is available at: http://${{ steps.terraform.outputs.alb_dns_name }}"

      - name: Notify Deployment Failure
        if: failure()
        run: |
          echo "❌ Deployment to ${{ github.event.inputs.environment }} failed!"
          echo "Please check the logs for details."
