name: Pull Request Validation

on:
  pull_request:
    branches: [ "main", "develop" ]
    types: [ opened, synchronize, reopened ]

jobs:
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
        continue-on-error: true

      - name: Check for merge conflicts
        run: |
          git fetch origin ${{ github.base_ref }}
          if git merge-tree $(git merge-base HEAD origin/${{ github.base_ref }}) HEAD origin/${{ github.base_ref }} | grep -q "<<<<<"; then
            echo "Merge conflicts detected!"
            exit 1
          fi

      - name: Check for large files
        run: |
          echo "Checking for large files (>5MB)..."
          git diff origin/${{ github.base_ref }}...HEAD --name-only | while read file; do
            if [ -f "$file" ]; then
              size=$(wc -c < "$file")
              if [ "$size" -gt 5242880 ]; then
                echo "Large file detected: $file ($(($size / 1024 / 1024))MB)"
                exit 1
              fi
            fi
          done

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Setup Backend Environment
        working-directory: ./backend
        run: |
          cp .env.example .env
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/appdb?schema=public" >> .env

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Validate Prisma Schema
        working-directory: ./backend
        run: npx prisma validate

      - name: Run Prisma Migrations
        working-directory: ./backend
        run: npx prisma migrate deploy

      - name: Lint Backend
        working-directory: ./backend
        run: npm run lint
        continue-on-error: true

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Test Backend
        working-directory: ./backend
        run: npm run test:cov

      - name: Check Test Coverage
        working-directory: ./backend
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(node -e "const c = require('./coverage/coverage-summary.json'); console.log(c.total.lines.pct);")
            echo "Test coverage: $COVERAGE%"
            if [ "$(echo "$COVERAGE < 80" | awk '{print ($1 < $3)}')" -eq 1 ]; then
              echo "Test coverage is below 80%!"
              exit 1
            fi
          else
            echo "No coverage report found"
            exit 1
          fi

      - name: Comment PR with Coverage
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('./backend/coverage/coverage-summary.json')) {
              const coverage = JSON.parse(fs.readFileSync('./backend/coverage/coverage-summary.json', 'utf8'));
              const pct = coverage.total.lines.pct;
              const body = `### Test Coverage Report\n\n` +
                `- Lines: ${pct}%\n` +
                `- Threshold: 80%\n` +
                `- Status: ${pct >= 80 ? '✅ Pass' : '❌ Fail'}`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
