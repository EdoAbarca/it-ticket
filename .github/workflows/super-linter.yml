name: Super-Linter

on:
  pull_request:
    branches: ["dev", "main"]

jobs:
  lint-code:
    name: Lint Code Base
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Backend (TypeScript)
        working-directory: ./backend
        run: npm run lint

      - name: Lint Frontend (JavaScript)
        working-directory: ./frontend
        run: npm run lint

      - name: Run Super-Linter for Additional Files
        uses: github/super-linter/slim@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          
          # Disable JS/TS linting (handled by project's ESLint)
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_JAVASCRIPT_ES: false
          
          # Enable YAML, Markdown, Dockerfile, and JSON linting
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_JSON: true
          
          # Ignore certain files/directories
          FILTER_REGEX_EXCLUDE: '.*/(node_modules|dist|build|coverage|\.next|\.vscode|\.git|package-lock\.json)/.*'
          
          # Show more details
          LOG_LEVEL: WARN
