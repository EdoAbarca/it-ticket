name: Docker Build

on:
  push:
    branches: [ "main", "develop" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  docker-build-test:
    name: Build and Test Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env files
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env

      - name: Build Docker images
        run: docker compose build --no-cache

      - name: Start services
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be healthy..."
          timeout 120 sh -c 'until docker compose ps | grep -q "healthy"; do sleep 2; done' || true
          docker compose ps

      - name: Check backend health
        run: |
          sleep 10
          curl -f http://localhost:3000/health || (docker compose logs backend && exit 1)

      - name: Check frontend availability
        run: |
          curl -f http://localhost:5173 || (docker compose logs frontend && exit 1)

      - name: Run backend tests in container
        run: |
          docker compose exec -T backend npm test || true

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v

      # Optional: Push to registry on main branch
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Push images to registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Images can be pushed to container registry here"
          # Uncomment to push to GHCR:
          # docker tag it-ticket-backend ghcr.io/${{ github.repository }}/backend:latest
          # docker tag it-ticket-frontend ghcr.io/${{ github.repository }}/frontend:latest
          # docker push ghcr.io/${{ github.repository }}/backend:latest
          # docker push ghcr.io/${{ github.repository }}/frontend:latest
        continue-on-error: true
