name: CI

on:
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  super-lint:
    name: Code Linting with Super Linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Super Linter
        uses: actions/cache@v4
        with:
          path: ~/.cache/super-linter
          key: super-linter-${{ runner.os }}
          restore-keys: |
            super-linter-${{ runner.os }}-

      - name: Run Super Linter
        uses: super-linter/super-linter@v6
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_CSS: true
          VALIDATE_HTML: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_DOCKERFILE: true
          VALIDATE_BASH: true
          LINTER_RULES_PATH: /
          FILTER_REGEX_EXCLUDE: '.*node_modules.*|.*dist.*|.*build.*'

  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Setup Backend Environment
        working-directory: ./backend
        run: |
          cp .env.example .env
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/appdb?schema=public" >> .env

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Run Prisma Migrations
        working-directory: ./backend
        run: npx prisma migrate deploy

      - name: Lint Backend
        working-directory: ./backend
        run: npm run lint
        continue-on-error: true

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm run test:cov

      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./backend/coverage
          flags: backend
          fail_ci_if_error: false

  build-docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [super-lint, lint-and-test]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env files
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env

      - name: Build Docker images
        run: docker compose build --no-cache

      - name: Start services
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be healthy..."
          timeout 120 sh -c 'until docker compose ps | grep -q "healthy"; do sleep 2; done' || true
          docker compose ps

      - name: Check backend health
        run: |
          sleep 10
          curl -f http://localhost:3000/health || (docker compose logs backend && exit 1)

      - name: Check frontend availability
        run: |
          curl -f http://localhost:5173 || (docker compose logs frontend && exit 1)

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get repository name
        id: repo-name
        run: |
          echo "repo_name=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Tag and Push Docker images
        run: |
          # Tag backend image
          docker tag it-ticket-backend ${{ secrets.DOCKERHUB_USERNAME }}/it-ticket-backend:latest
          docker tag it-ticket-backend ${{ secrets.DOCKERHUB_USERNAME }}/it-ticket-backend:pr-${{ github.event.pull_request.number }}
          
          # Tag frontend image
          docker tag it-ticket-frontend ${{ secrets.DOCKERHUB_USERNAME }}/it-ticket-frontend:latest
          docker tag it-ticket-frontend ${{ secrets.DOCKERHUB_USERNAME }}/it-ticket-frontend:pr-${{ github.event.pull_request.number }}
          
          # Push images
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/it-ticket-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/it-ticket-backend:pr-${{ github.event.pull_request.number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/it-ticket-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/it-ticket-frontend:pr-${{ github.event.pull_request.number }}

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v
