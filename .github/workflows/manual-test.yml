name: Manual CI/CD Test

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of test to run'
        required: true
        type: choice
        options:
          - all
          - lint
          - test
          - build
          - security

jobs:
  run-tests:
    name: Run Selected Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Setup Backend Environment
        working-directory: ./backend
        run: |
          cp .env.example .env
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/appdb?schema=public" >> .env

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Run Prisma Migrations
        working-directory: ./backend
        run: npx prisma migrate deploy

      - name: Run Lint Tests
        if: github.event.inputs.test_type == 'lint' || github.event.inputs.test_type == 'all'
        run: |
          echo "Running lint tests..."
          cd backend && npm run lint
          cd ../frontend && npm run lint

      - name: Run Unit Tests
        if: github.event.inputs.test_type == 'test' || github.event.inputs.test_type == 'all'
        working-directory: ./backend
        run: npm run test:cov

      - name: Run Build Tests
        if: github.event.inputs.test_type == 'build' || github.event.inputs.test_type == 'all'
        run: |
          echo "Running build tests..."
          cd backend && npm run build
          cd ../frontend && npm run build

      - name: Run Security Scans
        if: github.event.inputs.test_type == 'security' || github.event.inputs.test_type == 'all'
        run: |
          echo "Running security scans..."
          cd backend && npm audit --audit-level=moderate || true
          cd ../frontend && npm audit --audit-level=moderate || true

      - name: Test Summary
        if: always()
        run: |
          echo "Test type: ${{ github.event.inputs.test_type }}"
          echo "Status: Completed"
